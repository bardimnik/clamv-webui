<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
<div class="container" style="max-width: 520px; margin-top: 60px;">
    <div class="text-center mb-4">
        <img th:src="@{/images/logo.jpg}" style="width:80px;height:80px;" alt="logo">
        <h3 class="mt-2" th:text="#{app.title.full}">ClamAV Web UI Client</h3>
        <p class="text-muted" th:text="#{login.signIn}">Sign in</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger" th:text="#{login.invalid}">Invalid username or password.</div>
    <div th:if="${param.logout}" class="alert alert-success" th:text="#{login.loggedOut}">Logged out.</div>

    <form th:action="@{/login}" method="post" class="card p-4">
        <div class="mb-3">
            <label class="form-label" th:text="#{login.username}">Username</label>
            <input class="form-control" name="username" autofocus required />
        </div>
        <div class="mb-3">
            <label class="form-label" th:text="#{login.password}">Password</label>
            <input class="form-control" name="password" type="password" required />
        </div>
        <button class="btn btn-primary w-100" th:text="#{login.signIn}">Sign in</button>
    </form>

    <div class="text-muted small mt-3">
        <span th:text="#{login.firstRun}">First run default:</span>
        <strong>admin / admin</strong>
        <span th:text="#{login.changeInAdmin}">(change in Admin → Users).</span>
    </div>
</div>
</body>
</html>
