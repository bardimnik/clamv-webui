<div th:fragment="dashboardOverview" data-page="dashboard" xmlns:th="http://www.thymeleaf.org">
  <div class="card mb-3">
    <div class="card-body">
      <h4 class="card-title" th:text="#{dashboard.title}">Dashboard</h4>
      <div class="text-muted" th:text="#{dashboard.subtitle}">Overview of endpoints and recent scan activity.</div>
    </div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-md-4">
      <div class="card">
        <div class="card-body">
          <div class="text-muted" th:text="#{dashboard.endpointsTotal}">Endpoints (total)</div>
          <div class="kpi" th:text="${endpointsCount}">0</div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card">
        <div class="card-body">
          <div class="text-muted" th:text="#{dashboard.recentJobs}">Recent jobs</div>
          <div class="kpi" th:text="${jobsCount}">0</div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card">
        <div class="card-body">
          <div class="text-muted" th:text="#{dashboard.defaultEndpoint}">Default endpoint</div>
          <div class="kpi-sm" th:text="${defaultEndpointName}">—</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <h5 class="m-0" th:text="#{dashboard.latestJobs}">Latest scan jobs</h5>
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/jobs}" href="/jobs" th:text="#{common.viewAll}">View all</a>
      </div>

      <div th:if="${jobs == null or #lists.isEmpty(jobs)}" class="text-muted" th:text="#{common.noJobs}">No jobs yet.</div>

      <div th:if="${jobs != null and !#lists.isEmpty(jobs)}" class="table-responsive">
        <table class="table table-sm table-striped align-middle">
          <thead>
          <tr>
            <th th:text="#{common.id}">Id</th>
            <th th:text="#{common.type}">Type</th>
            <th th:text="#{common.status}">Status</th>
            <th th:text="#{common.verdict}">Verdict</th>
            <th th:text="#{common.target}">Target</th>
            <th th:text="#{common.endpoint}">Endpoint</th>
            <th th:text="#{common.submitted}">Submitted</th>
            <th th:text="#{common.user}">User</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="j : ${jobs}">
            <td><a th:href="@{'/jobs/' + ${j.id}}" th:text="${j.id}">id</a></td>
            <td th:text="${j.type}">type</td>
            <td th:text="${j.status}">status</td>
            <td th:text="${j.verdict}">verdict</td>
            <td th:text="${j.target}">target</td>
            <td th:text="${j.endpoint != null ? j.endpoint.name : ''}">ep</td>
            <td th:text="${j.submittedAt}">time</td>
            <td th:text="${j.submittedBy}">user</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
