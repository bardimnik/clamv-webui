<div th:fragment="admin-audit" data-ui-build="2.3.4" data-page="audit" xmlns:th="http://www.thymeleaf.org">
    <h4 th:text="#{audit.title}">Admin: Audit log</h4>
    <div class="table-responsive">
        <table class="table table-sm table-striped align-middle">
            <thead>
            <tr>
                <th th:text="#{audit.at}">At</th>
                <th th:text="#{common.user}">User</th>
                <th th:text="#{audit.action}">Action</th>
                <th th:text="#{audit.outcome}">Outcome</th>
                <th th:text="#{audit.job}">Job</th>
                <th th:text="#{audit.details}">Details</th>
                <th th:text="#{audit.ip}">IP</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${auditEvents}">
                <td th:text="${a.at}"></td>
                <td th:text="${a.username}"></td>
                <td th:text="${a.action}"></td>
                <td th:text="${a.outcome}"></td>
                <td th:text="${a.jobId}"></td>
                <td th:text="${a.details}"></td>
                <td th:text="${a.ip}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
